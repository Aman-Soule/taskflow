{% extends "base.html" %}

{% block content %}

<form method="post">
  {% csrf_token %}
  <div class="card-body">
    <div class="form-group"><label>Projet</label>{{ form.project }}{{ form.project.errors }}</div>
    <div class="form-group"><label>Titre</label>{{ form.title }}{{ form.title.errors }}</div>
    <div class="form-row">
      <div class="form-group"><label>Statut</label>{{ form.status }}</div>
      <div class="form-group"><label>Échéance</label>{{ form.due_date }}{{ form.due_date.errors }}</div>
    </div>
  </div>
  <div class="card-footer" style="justify-content:flex-end; gap:10px;">
    <a class="btn" href="{% url 'tasks:task_list' %}">Annuler</a>
    <button class="btn btn-primary" type="submit">Enregistrer</button>
  </div>
</form>

{% endblock %}

{% comment %}
  Usage : include "partials/status_badge.html" with status=task.status
  Valeurs attendues : todo / in_progress / done / late
{% endcomment %}

{% if status == "done" %}<span class="badge badge-green">Terminée</span>
{% elif status == "doing" %}<span class="badge badge-blue">En cours</span>
{% elif status == "late" %}<span class="badge badge-red">En retard</span>
{% else %}<span class="badge badge-gray">À faire</span>{% endif %}

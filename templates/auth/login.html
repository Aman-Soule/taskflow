{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion · TaskFlow</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-page">
  <div class="auth-card">
    <a class="brand" href="#"><span class="brand-logo"><i class="fa-solid fa-check"></i></span> TaskFlow</a>
    <h1>Connexion</h1>

    {% include "partials/messages.html" %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="id_username">Nom d'utilisateur</label>
        <input class="form-control" type="text" name="username" id="id_username" required autofocus>
      </div>
      <div class="form-group">
        <label for="id_password">Mot de passe</label>
        <input class="form-control" type="password" name="password" id="id_password" required>
      </div>
      {% if form.errors %}<p class="form-error">Identifiants incorrects.</p>{% endif %}
      <button class="btn btn-primary btn-block" type="submit">Se connecter</button>
    </form>

    <p class="auth-footer">Pas encore de compte ? <a href="#">Créer un compte</a></p>
  </div>
</body>
</html>

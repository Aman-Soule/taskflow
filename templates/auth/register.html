{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription · TaskFlow</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-page">
  <div class="auth-card">
    <a class="brand" href="#"><span class="brand-logo"><i class="fa-solid fa-check"></i></span> TaskFlow</a>
    <h1>Créer un compte</h1>

    <form method="post">
      {% csrf_token %}
      <div class="form-row">
        <div class="form-group">
          <label for="id_first_name">Prénom</label>
          <input class="form-control" type="text" name="first_name" id="id_first_name" required>
        </div>
        <div class="form-group">
          <label for="id_last_name">Nom</label>
          <input class="form-control" type="text" name="last_name" id="id_last_name" required>
        </div>
      </div>
      <div class="form-group">
        <label for="id_email">E-mail</label>
        <input class="form-control" type="email" name="email" id="id_email" required>
      </div>
      <div class="form-group">
        <label for="id_password1">Mot de passe</label>
        <input class="form-control" type="password" name="password1" id="id_password1" required>
      </div>
      <div class="form-group">
        <label for="id_password2">Confirmer le mot de passe</label>
        <input class="form-control" type="password" name="password2" id="id_password2" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Créer mon compte</button>
    </form>

    <p class="auth-footer">Déjà inscrit ? <a href="#">Se connecter</a></p>
  </div>
</body>
</html>
